org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Prefer Android Studio JBR (21). System Temurin 25 breaks Kotlin DSL parsing.
# Symlink created at ~/.local/jdk/android-studio-jbr (path must not contain spaces).
# Uncomment below line
# org.gradle.java.home=/Users/zander.kotze/.local/jdk/android-studio-jbr
#
# AGP 9.x (#89): keep Flutter migrator opt-outs until app + plugins migrate to
# built-in Kotlin / new DSL. Flutter 3.47 supports AGP 9 with these false.
# Enabling builtInKotlin=true requires all plugins to drop kotlin-android first.
# See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
android.builtInKotlin=false
android.newDsl=false
