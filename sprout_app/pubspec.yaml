name: sprout
description: "Watch your money grow and for those who want to reach their goals quickly."
publish_to: 'none'

version: 1.3.2+12

environment:
  sdk: ^3.11.1

dependencies:
  bloc_concurrency: ^0.3.0
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  debug_lens: ^0.0.2
  equatable: ^2.0.7
  firebase_analytics: ^12.6.0
  firebase_core: ^4.13.0
  firebase_remote_config: ^6.5.6
  fl_chart: ^0.70.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_markdown: ^0.7.7+1
  flutter_svg: ^2.0.14
  get_it: ^8.0.3
  go_router: ^17.5.0
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  provider: ^6.1.2
  purchases_flutter: ^10.4.3
  purchases_ui_flutter: ^10.4.3
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/development.json
    - assets/config/production.json
    - assets/legal/terms.md
    - assets/legal/privacy.md
    - assets/images/sprout-icon.png
    - assets/images/google_g_logo.svg
