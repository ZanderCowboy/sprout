name: sprout
description: "Watch your money grow and for those who want to reach their goals quickly."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.1
  equatable: ^2.0.7
  fl_chart: ^0.70.2
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  go_router: ^17.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  purchases_flutter: ^10.4.3
  purchases_ui_flutter: ^10.4.3
  supabase_flutter: ^2.8.4
  uuid: ^4.5.1
  bloc_concurrency: ^0.3.0
  firebase_core: ^4.13.0
  firebase_remote_config: ^6.5.6
  google_sign_in: ^7.2.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/development.json
    - assets/config/production.json
    - assets/legal/terms.md
    - assets/legal/privacy.md
