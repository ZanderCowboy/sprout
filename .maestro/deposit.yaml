appId: app.stackmint.sprout.dev
tags:
  - page
env:
  EMAIL: sprout.play.review@gmail.com
---
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/deposit.yaml
# Deposit sheet modes from FAB and goal-detail quick deposit.
# Seeds unallocated (to-account) then a goal deposit so all modes appear.
# Run: maestro test .maestro/deposit.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-to-overview.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- runFlow:
    file: shared/seed-core.yaml
    env:
      SEED_GOAL: "true"

- runFlow: shared/open-center-sheet.yaml

- tapOn:
    id: "shell_action_deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 5000

- tapOn:
    id: "deposit_mode_to_account"

- tapOn:
    id: "deposit_account_dropdown"

- tapOn:
    text: "Everyday"

- tapOn:
    id: "deposit_amount_field"

- eraseText

- inputText: "1000"

- hideKeyboard

- tapOn:
    id: "deposit_save"

- runFlow: shared/wait-overview.yaml

- tapOn:
    id: "overview_deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 5000

- runFlow:
    file: shared/deposit-to-goal.yaml
    env:
      ACCOUNT_NAME: "Everyday"
      GOAL_NAME: "Everyday Fund"
      AMOUNT: "500"

- runFlow: shared/wait-overview.yaml

- runFlow: shared/chapter-deposit.yaml
