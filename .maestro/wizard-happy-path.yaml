appId: app.stackmint.sprout.dev
tags:
  - wizard
env:
  EMAIL: sprout.play.review@gmail.com
---
# Wizard happy path: OTP sign-in → complete wizard → Overview with progress
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/wizard-happy-path.yaml
# Run: maestro test .maestro/wizard-happy-path.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-intro.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- runFlow: shared/complete-wizard.yaml

- extendedWaitUntil:
    visible:
      id: "shell_tab_overview"
    timeout: 10000

- assertVisible:
    text: "Overall progress"

- assertVisible:
    text: "Cape Town trip"

- assertVisible:
    text: "R 2 500"

- assertVisible:
    text: "You're growing — first seed planted."
