appId: app.stackmint.sprout.dev
tags:
  - wizard
---
# Wizard happy path: complete goal → account → deposit → verify Overview with progress
# Run: maestro test .maestro/wizard-happy-path.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      id: "intro_debug_sign_in"
    timeout: 45000

- tapOn:
    id: "intro_debug_sign_in"

- runFlow: shared/complete-wizard.yaml

- extendedWaitUntil:
    visible:
      id: "shell_tab_overview"
    timeout: 10000

- assertVisible:
    text: "Overall progress"

- assertVisible:
    text: "Cape Town trip"

- assertVisible:
    text: "R 2 500"

- assertVisible:
    text: "You're growing — first seed planted."
