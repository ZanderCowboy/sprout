appId: app.stackmint.sprout.dev
tags:
  - page
env:
  EMAIL: sprout.play.review@gmail.com
---
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/overview.yaml
# Overview empty CTAs, then seed and walk populated controls.
# Run: maestro test .maestro/overview.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-to-overview.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- runFlow: shared/chapter-overview-empty.yaml

- runFlow:
    file: shared/seed-core.yaml
    env:
      SEED_GOAL: "true"
      SEED_DEPOSIT: "true"

- runFlow: shared/chapter-overview-populated.yaml
