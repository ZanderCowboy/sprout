appId: app.stackmint.sprout.dev
tags:
  - page
  - premium
  - purchases
  - purchase
---
# Complete a RevenueCat Test Store sandbox purchase from Settings Premium.
# clearState → unsubscribed configure UUID → Upgrade → paywall → Monthly /
# Continue → Test Store Purchase → Settings shows Premium active + Manage.
# Selectors adapt to Test Store UI (Monthly / Continue / Purchase observed).
# Run: maestro test .maestro/settings-premium-purchase.yaml

- setAirplaneMode: disabled

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: shared/debug-signin-intro.yaml

- tapOn:
    id: "shell_tab_settings"

- extendedWaitUntil:
    visible:
      id: "settings_premium"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: ".*Upgrade.*"
    timeout: 20000

- tapOn:
    id: "settings_premium"

- extendedWaitUntil:
    visible:
      text: ".*(Monthly|Annual|R79|Subscribe|Continue).*"
    timeout: 25000

- runFlow:
    when:
      visible:
        text: ".*Monthly.*"
    commands:
      - tapOn:
          text: ".*Monthly.*"

- runFlow:
    when:
      visible:
        text: "Subscribe"
    commands:
      - tapOn:
          text: "Subscribe"

- runFlow:
    when:
      visible:
        text: "Continue"
    commands:
      - tapOn:
          text: "Continue"

- extendedWaitUntil:
    visible:
      text: ".*(Buy|Purchase|Confirm|Test Store|OK|Subscribe).*"
    timeout: 20000
    optional: true

- runFlow:
    when:
      visible:
        text: ".*Buy.*"
    commands:
      - tapOn:
          text: ".*Buy.*"

- runFlow:
    when:
      visible:
        text: ".*Purchase.*"
    commands:
      - tapOn:
          text: ".*Purchase.*"

- runFlow:
    when:
      visible:
        text: ".*Confirm.*"
    commands:
      - tapOn:
          text: ".*Confirm.*"

- runFlow:
    when:
      visible:
        text: ".*(Got it|OK|Close|Success|Thank|Unlocked).*"
    commands:
      - tapOn:
          text: ".*(Got it|OK|Close|Success|Thank|Unlocked).*"

- runFlow:
    when:
      notVisible:
        id: "settings_premium"
    commands:
      - back

- extendedWaitUntil:
    visible:
      id: "settings_premium"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: ".*Premium active.*"
    timeout: 30000

- assertVisible:
    text: ".*Premium active.*"

- assertVisible:
    text: ".*Manage.*"
