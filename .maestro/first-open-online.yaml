appId: app.stackmint.sprout.dev
tags:
  - smoke
  - auth
env:
  EMAIL: sprout.play.review@gmail.com
---
# First open online: carousel → Create account surface → OTP sign-in → wizard → Overview
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/first-open-online.yaml
# Run: maestro test .maestro/first-open-online.yaml
# Slide titles share an a11y node with body text — use regex, not exact title.

- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      id: "intro_next"
    timeout: 45000

- assertVisible:
    text: ".*Track your savings in one place.*"

- tapOn:
    id: "intro_next"

- assertVisible:
    text: ".*Set goals and watch them grow.*"

- tapOn:
    id: "intro_next"

- assertVisible:
    text: ".*Sign in so your data stays with you.*"

- tapOn:
    id: "intro_create_account"

- extendedWaitUntil:
    visible:
      id: "create_account_continue"
    timeout: 5000

- assertVisible:
    text: ".*Create account.*|.*display name.*"

- tapOn:
    id: "create_account_sign_in_link"

- runFlow:
    file: shared/otp-signin-from-sign-in.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- extendedWaitUntil:
    visible:
      id: "wizard_skip"
    timeout: 45000
    optional: true

- runFlow:
    when:
      visible:
        id: "wizard_skip"
    file: shared/skip-wizard.yaml

- extendedWaitUntil:
    visible:
      id: "shell_tab_overview"
    timeout: 10000

- assertVisible:
    text: ".*Welcome to Sprout.*"
