appId: app.stackmint.sprout.dev
tags:
  - edge
  - auth
---
# Google Sign-In smoke (DEV). Account picker is system UI — may need a human
# if the device has no Google account or picker layout differs.
# Expected: signed-in session (wizard or Overview), not "Google Sign-In was cancelled."
# Run: maestro test .maestro/google-sign-in.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      id: "intro_next"
    timeout: 45000

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_next"

- extendedWaitUntil:
    visible:
      id: "sign_in_google"
    timeout: 10000

- tapOn:
    id: "sign_in_google"

# System account chooser (best-effort). Prefer Play review account on emulator.
- extendedWaitUntil:
    visible:
      text: ".*sprout\\.play\\.review@gmail\\.com.*|.*Choose an account.*|.*Continue.*"
    timeout: 30000
    optional: true

- tapOn:
    text: "sprout.play.review@gmail.com"
    optional: true

- tapOn:
    text: ".*@gmail\\.com.*"
    optional: true

- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    text: "OK"
    optional: true

# Must NOT stay on cancelled error
- extendedWaitUntil:
    visible:
      id: "wizard_skip"
    timeout: 60000
    optional: true

- runFlow:
    when:
      visible:
        id: "wizard_skip"
    file: shared/skip-wizard.yaml

- extendedWaitUntil:
    visible:
      text: ".*Portfolio total.*|.*Welcome to Sprout.*"
    timeout: 60000

- assertNotVisible: "Google Sign-In was cancelled."