appId: app.stackmint.sprout.dev
tags:
  - page
  - premium
  - purchases
  - subscribed
---
# Premium subscribed (single clearState).
# Coverage: former settings-premium-subscribed + master-budget-premium.
# Asserts Settings Premium active + Manage, then Master Budget planner opens.
#
# IMPORTANT — Purchases appUserID vs debug sign-in:
# - Cold start with clearState: resolveUserId() mints a random UUID and
#   Purchases.configure uses that UUID BEFORE debugSignIn.
# - debugSignIn sets UserContext/Hive to AuthService.maestroTestUserId
#   (`maestro-test-user`) but does NOT call Purchases.logIn — so the promo
#   grant on `maestro-test-user` is NOT seen after clearState alone.
# - After process death / soft relaunch (no clearState), configure reads Hive
#   and uses `maestro-test-user` — grant on that id then applies.
# Until product adds Purchases.logIn after debugSignIn, or a prior Test Store
# purchase left premium active, expect FAIL after fresh clearState.
# Run: maestro test .maestro/premium-subscribed.yaml

- setAirplaneMode: disabled

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: shared/debug-signin-intro.yaml

- tapOn:
    id: "shell_tab_settings"

- extendedWaitUntil:
    visible:
      id: "settings_premium"
    timeout: 15000

- assertVisible:
    id: "settings_premium"

# Wait out "Checking subscription...". Merged SproutListTile semantics need regex.
- extendedWaitUntil:
    visible:
      text: ".*Premium active.*"
    timeout: 30000

- assertVisible:
    text: ".*Premium active.*"

- assertVisible:
    text: ".*Manage.*"

- extendedWaitUntil:
    visible:
      id: "settings_budget"
    timeout: 10000

- tapOn:
    id: "settings_budget"

- extendedWaitUntil:
    visible:
      text: "Master Budget"
    timeout: 15000

- assertVisible:
    text: "Master Budget"

- assertVisible:
    id: "budget_sort"
