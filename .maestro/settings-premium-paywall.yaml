appId: app.stackmint.sprout.dev
tags:
  - p1
  - page
  - premium
  - purchases
  - paywall
env:
  EMAIL: sprout.play.review@gmail.com
---
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/settings-premium-paywall.yaml
# Assert Settings Premium opens the RevenueCat paywall when unsubscribed.
# clearState mint + configure UUID has no entitlement → Upgrade / Unlock premium.
# Paywall is purchases_ui_flutter (no Sprout semantics) — match package/price text.
# Dismiss with back — do NOT complete a purchase (see settings-premium-purchase.yaml).
#
# Merged SproutListTile semantics: match Upgrade via contains regex.
# Run: maestro test .maestro/settings-premium-paywall.yaml

- setAirplaneMode: disabled

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-to-overview.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- tapOn:
    id: "shell_tab_settings"

- extendedWaitUntil:
    visible:
      id: "settings_premium"
    timeout: 15000

- assertVisible:
    id: "settings_premium"

- extendedWaitUntil:
    visible:
      text: ".*Upgrade.*"
    timeout: 20000

- assertVisible:
    text: ".*Upgrade.*"

- tapOn:
    id: "settings_premium"

- extendedWaitUntil:
    visible:
      text: ".*(Monthly|Annual|R79|Subscribe|Continue).*"
    timeout: 25000

- assertVisible:
    text: ".*(Monthly|Annual|R79|Subscribe|Continue).*"

- back

- extendedWaitUntil:
    visible:
      id: "settings_premium"
    timeout: 10000

- assertVisible:
    id: "settings_premium"
