appId: app.stackmint.sprout.dev
---
# Full app journey: every reachable screen and tappable control.
# Requires development flavor. Composes shared helpers from .maestro/shared/.
# Run: maestro test .maestro/full-app-tour.yaml

- launchApp:
    clearState: true
    clearKeychain: true

# ===== 1. Intro + Sign in (tour-only auth path) =====
- extendedWaitUntil:
    visible:
      id: "intro_next"
    timeout: 45000

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_next"

- extendedWaitUntil:
    visible:
      id: "sign_in_debug_sign_in"
    timeout: 5000

- tapOn:
    id: "sign_in_terms_link"

- extendedWaitUntil:
    visible:
      text: "Terms of Service"
    timeout: 10000

- back

- tapOn:
    id: "sign_in_privacy_link"

- extendedWaitUntil:
    visible:
      text: "Privacy Policy"
    timeout: 10000

- back

- tapOn:
    id: "sign_in_display_name_field"

- inputText: "Tour User"

- tapOn:
    id: "sign_in_email_field"

- inputText: "tour@example.com"

- tapOn:
    id: "sign_in_debug_sign_in"

- runFlow: shared/wait-overview.yaml

# ===== 2. Empty states =====
- assertVisible: "1. Add an account"

- takeScreenshot: tour-01-overview-empty

- tapOn:
    id: "overview_empty_new_goal"

- extendedWaitUntil:
    visible:
      text: "New goal"
    timeout: 5000

- assertVisible: "Create an account first to hold money for this goal."

- tapOn:
    id: "goal_no_accounts_cancel"

- runFlow: shared/open-center-sheet.yaml

- tapOn:
    id: "shell_action_deposit"

- extendedWaitUntil:
    visible:
      text: "Create an account first"
    timeout: 5000

- back

- tapOn:
    id: "overview_empty_new_account"

- extendedWaitUntil:
    visible:
      text: "New account"
    timeout: 5000

- runFlow:
    file: shared/fill-account-form.yaml
    env:
      ACCOUNT_NAME: "Everyday"
      COLOR_INDEX: "2"

- runFlow: shared/wait-overview.yaml

- tapOn:
    id: "shell_tab_goals"

- assertVisible: "Goals"

- tapOn:
    id: "shell_tab_overview"

# ===== 3. Seed data via helpers =====
- tapOn:
    id: "overview_new_account"

- extendedWaitUntil:
    visible:
      text: "New account"
    timeout: 5000

- runFlow:
    file: shared/fill-account-form.yaml
    env:
      ACCOUNT_NAME: "Spare"
      COLOR_INDEX: "3"

- runFlow: shared/wait-overview.yaml

- tapOn:
    id: "overview_new_goal"

- extendedWaitUntil:
    visible:
      text: "New goal"
    timeout: 5000

- runFlow:
    file: shared/fill-goal-form.yaml
    env:
      GOAL_NAME: "Everyday Fund"
      TARGET: "10000"
      ALREADY_SAVED: "500"
      ACCOUNT_NAME: "Everyday"

- runFlow: shared/wait-overview.yaml

- tapOn:
    id: "overview_new_goal"

- extendedWaitUntil:
    visible:
      text: "New goal"
    timeout: 5000

- runFlow:
    file: shared/fill-goal-form.yaml
    env:
      GOAL_NAME: "Spare Goal"
      TARGET: "5000"

- runFlow: shared/wait-overview.yaml

- tapOn:
    id: "overview_deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 5000

- runFlow:
    file: shared/deposit-to-goal.yaml
    env:
      ACCOUNT_NAME: "Everyday"
      GOAL_NAME: "Everyday Fund"
      AMOUNT: "2500"

- runFlow: shared/open-center-sheet.yaml

- tapOn:
    id: "shell_action_deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 5000

- tapOn:
    id: "deposit_mode_to_account"

- tapOn:
    id: "deposit_account_dropdown"

- tapOn:
    text: "Everyday"

- tapOn:
    id: "deposit_amount_field"

- eraseText

- inputText: "1000"

- tapOn:
    id: "deposit_save"

- runFlow: shared/wait-overview.yaml

- tapOn:
    id: "overview_deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 5000

- tapOn:
    id: "deposit_account_dropdown"

- tapOn:
    text: "Everyday"

- tapOn:
    id: "deposit_goal_dropdown"

- tapOn:
    text: "Everyday Fund"

- tapOn:
    id: "deposit_amount_field"

- eraseText

- inputText: "200"

- tapOn:
    id: "deposit_date_picker"

- tapOn:
    text: "OK"
    optional: true

- tapOn:
    id: "deposit_recurring_toggle"

- tapOn:
    id: "deposit_frequency_dropdown"

- tapOn:
    text: "Monthly"

- tapOn:
    id: "deposit_save"

- runFlow: shared/wait-overview.yaml

- takeScreenshot: tour-02-overview-populated

# ===== 4. Overview populated controls =====
- tapOn:
    id: "overview_progress_header"

- tapOn:
    id: "shell_tab_overview"

- tapOn:
    id: "overview_deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 3000

- back

- tapOn:
    id: "overview_new_account"

- extendedWaitUntil:
    visible:
      text: "New account"
    timeout: 3000

- back

- tapOn:
    id: "overview_new_goal"

- extendedWaitUntil:
    visible:
      text: "New goal"
    timeout: 3000

- back

- tapOn:
    id: "overview_transaction_row"
    optional: true

- extendedWaitUntil:
    visible:
      text: "Transaction"
    timeout: 5000
    optional: true

- back
    optional: true

# ===== 5. Shell FAB actions =====
- runFlow: shared/open-center-sheet.yaml

- tapOn:
    id: "shell_action_new_account"

- extendedWaitUntil:
    visible:
      text: "New account"
    timeout: 3000

- back

- runFlow: shared/open-center-sheet.yaml

- tapOn:
    id: "shell_action_new_goal"

- extendedWaitUntil:
    visible:
      text: "New goal"
    timeout: 3000

- back

- runFlow: shared/open-center-sheet.yaml

- tapOn:
    id: "shell_action_deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 3000

- back

# ===== 6. Accounts tab + detail =====
- tapOn:
    id: "shell_tab_accounts"

- assertVisible: "Accounts"

- tapOn:
    id: "account_card"
    text: "Everyday"

- extendedWaitUntil:
    visible:
      text: "Account value"
    timeout: 5000

- tapOn:
    id: "account_detail_edit"

- extendedWaitUntil:
    visible:
      text: "Edit"
    timeout: 3000

- tapOn:
    id: "color_swatch_1"

- tapOn:
    id: "form_save"

- tapOn:
    id: "account_detail_deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 3000

- back

- tapOn:
    id: "account_detail_transaction_row"
    optional: true

- extendedWaitUntil:
    visible:
      text: "Transaction"
    timeout: 5000
    optional: true

- tapOn:
    id: "transaction_note_field"
    optional: true

- inputText: "Tour note"
    optional: true

- tapOn:
    id: "transaction_note_save"
    optional: true

- back
    optional: true

- tapOn:
    id: "account_detail_clear_scheduled"
    optional: true

- tapOn:
    id: "dialog_delete"
    optional: true

- back

- tapOn:
    id: "account_card"
    text: "Spare"

- extendedWaitUntil:
    visible:
      text: "Spare"
    timeout: 5000

- tapOn:
    id: "account_detail_delete"

- tapOn:
    id: "dialog_delete"

- tapOn:
    id: "shell_tab_accounts"

# ===== 7. Goals tab + detail =====
- tapOn:
    id: "shell_tab_goals"

- assertVisible: "Goals"

- tapOn:
    id: "goal_sort_menu"

- tapOn:
    text: "Remaining (low → high)"

- tapOn:
    id: "goal_sort_menu"

- tapOn:
    text: "Progress (high → low)"

- tapOn:
    id: "goal_sort_menu"

- tapOn:
    text: "Name (A → Z)"

- tapOn:
    id: "goal_unallocated_card"
    optional: true

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 5000
    optional: true

- back
    optional: true

- tapOn:
    id: "goal_card"
    text: "Everyday Fund"

- extendedWaitUntil:
    visible:
      text: "Remaining"
    timeout: 5000

- tapOn:
    id: "goal_detail_edit"

- extendedWaitUntil:
    visible:
      text: "Edit"
    timeout: 3000

- tapOn:
    id: "goal_name_field"

- eraseText

- inputText: "Everyday Fund"

- tapOn:
    id: "form_save"

- tapOn:
    id: "goal_detail_deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 3000

- back

- tapOn:
    id: "goal_detail_transaction_row"
    optional: true

- extendedWaitUntil:
    visible:
      text: "Transaction"
    timeout: 5000
    optional: true

- tapOn:
    id: "transaction_manage_recurring"
    optional: true

- back
    optional: true

- back
    optional: true

- tapOn:
    id: "goal_detail_clear_scheduled"
    optional: true

- tapOn:
    id: "dialog_delete"
    optional: true

- back

- tapOn:
    id: "goal_card"
    text: "Spare Goal"

- tapOn:
    id: "goal_detail_delete"

- tapOn:
    id: "dialog_delete"

- tapOn:
    id: "shell_tab_goals"

# ===== 8. Deposit modes (allocate unallocated) =====
- runFlow: shared/open-center-sheet.yaml

- tapOn:
    id: "shell_action_deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 5000

- tapOn:
    id: "deposit_mode_use_unallocated"
    optional: true

- tapOn:
    id: "deposit_add_allocation"
    optional: true

- tapOn:
    id: "deposit_remove_allocation"
    optional: true

- back

# ===== 9. Settings subtree =====
- tapOn:
    id: "shell_tab_settings"

- assertVisible: "Settings"

- takeScreenshot: tour-03-settings

- tapOn:
    id: "settings_premium"
    optional: true

- back
    optional: true

- tapOn:
    id: "settings_transactions"

- extendedWaitUntil:
    visible:
      text: "Transactions"
    timeout: 5000

- tapOn:
    id: "transaction_row"
    optional: true

- extendedWaitUntil:
    visible:
      text: "Transaction"
    timeout: 5000
    optional: true

- back
    optional: true

- back

- tapOn:
    id: "settings_recurring"

- extendedWaitUntil:
    visible:
      text: "Recurring payments"
    timeout: 5000

- tapOn:
    id: "recurring_row"
    optional: true

- tapOn:
    id: "recurring_edit"
    optional: true

- tapOn:
    id: "recurring_save"
    optional: true

- tapOn:
    id: "recurring_delete"
    optional: true

- tapOn:
    id: "recurring_cancel"
    optional: true

- back

- tapOn:
    id: "settings_budget"

- extendedWaitUntil:
    visible:
      text: "Master Budget"
    timeout: 5000

- tapOn:
    id: "budget_tab_income"

- tapOn:
    id: "budget_tab_essentials"

- tapOn:
    id: "budget_tab_lifestyle"

- tapOn:
    id: "budget_tab_income"

- tapOn:
    id: "budget_add_group"

- tapOn:
    text: "Untitled group"

- inputText: "Salary"

- tapOn:
    text: "Master Budget"

- tapOn:
    id: "budget_sort"

- tapOn:
    id: "budget_sort_save"

- longPressOn:
    id: "budget_group_card"
    optional: true

- tapOn:
    id: "dialog_cancel"
    optional: true

- back

- tapOn:
    id: "settings_account"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

- tapOn:
    id: "account_edit_display_name"

- tapOn:
    id: "account_edit_name_field"

- eraseText

- inputText: "Tour User"

- tapOn:
    id: "account_edit_name_save"

- tapOn:
    id: "account_terms"

- extendedWaitUntil:
    visible:
      text: "Terms of Service"
    timeout: 10000

- back

- tapOn:
    id: "account_privacy"

- extendedWaitUntil:
    visible:
      text: "Privacy Policy"
    timeout: 10000

- back

- tapOn:
    id: "account_delete"

- tapOn:
    id: "account_delete_cancel"

- back

# ===== 10. Sign out (last) =====
- tapOn:
    id: "settings_account"

- tapOn:
    id: "account_sign_out"

- extendedWaitUntil:
    visible:
      id: "intro_next"
    timeout: 15000

- takeScreenshot: tour-04-signed-out
