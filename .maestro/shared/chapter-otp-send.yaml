appId: app.stackmint.sprout.dev
---
# Requires: intro screen visible (fresh launch).
# Walks intro → create account (terms/privacy), fills Play Review + ${EMAIL},
# taps Continue, waits for verify OTP field. Does NOT debug-sign-in or Google.
- extendedWaitUntil:
    visible:
      id: "intro_next"
    timeout: 45000

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_create_account"

- extendedWaitUntil:
    visible:
      id: "create_account_continue"
    timeout: 5000

- tapOn:
    id: "create_account_terms_link"

- extendedWaitUntil:
    visible:
      text: "Terms of Service"
    timeout: 10000

- back

- tapOn:
    id: "create_account_privacy_link"

- extendedWaitUntil:
    visible:
      text: "Privacy Policy"
    timeout: 10000

- back

- tapOn:
    id: "create_account_display_name_field"

- inputText: "Play Review"

- tapOn:
    id: "create_account_email_field"

- inputText: ${EMAIL}

- hideKeyboard

- tapOn:
    id: "create_account_continue"

- extendedWaitUntil:
    visible:
      id: "verify_otp_code_field"
    timeout: 30000