appId: app.stackmint.sprout.dev
---
# Requires: intro screen visible (fresh launch).
# Walks intro → create account (terms/privacy), fills Play Review + ${EMAIL},
# taps Continue. If email already exists, Sign in instead (refill EMAIL) and
# send OTP. Leaves app on verify OTP field.
- extendedWaitUntil:
    visible:
      id: "intro_next"
    timeout: 45000

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_create_account"

- extendedWaitUntil:
    visible:
      id: "create_account_continue"
    timeout: 5000

- tapOn:
    id: "create_account_terms_link"

- extendedWaitUntil:
    visible:
      text: "Terms of Service"
    timeout: 10000

- back

- extendedWaitUntil:
    visible:
      id: "create_account_privacy_link"
    timeout: 10000

- tapOn:
    id: "create_account_privacy_link"

- extendedWaitUntil:
    visible:
      text: "Privacy Policy"
    timeout: 10000

- back

- extendedWaitUntil:
    visible:
      id: "create_account_display_name_field"
    timeout: 10000

- tapOn:
    id: "create_account_display_name_field"

- inputText: "Play Review"

- tapOn:
    id: "create_account_email_field"

- inputText: ${EMAIL}

- hideKeyboard

- tapOn:
    id: "create_account_continue"

- runFlow:
    when:
      visible:
        text: "Account already exists"
    commands:
      - tapOn:
          id: "create_account_existing_sign_in"
      - extendedWaitUntil:
          visible:
            id: "sign_in_email_field"
          timeout: 10000
      - tapOn:
          id: "sign_in_email_field"
      - eraseText
      - inputText: ${EMAIL}
      - hideKeyboard
      - tapOn:
          id: "sign_in_continue"

- extendedWaitUntil:
    visible:
      id: "verify_otp_code_field"
    timeout: 30000
