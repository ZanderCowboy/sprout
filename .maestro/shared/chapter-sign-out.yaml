appId: app.stackmint.sprout.dev
---
# Tour-only. Requires: signed in. Leaves app on auth after sign-out.
# After introCompleted (OTP/Google), unsigned gate is Sign in — not intro.

- tapOn:
    id: "shell_tab_settings"

- scrollUntilVisible:
    element:
      id: "account_sign_out"
    direction: DOWN
    centerElement: true
    timeout: 15000

- tapOn:
    id: "account_sign_out"

- extendedWaitUntil:
    visible:
      id: "sign_in_email_field"
    timeout: 20000
