appId: app.stackmint.sprout.dev
---
# Tour-only. Requires: signed in. Leaves app on Sign in after sign-out.
- tapOn:
    id: "shell_tab_settings"

- tapOn:
    id: "settings_account"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

- tapOn:
    id: "account_sign_out"

- extendedWaitUntil:
    visible:
      id: "sign_in_debug_sign_in"
    timeout: 15000
