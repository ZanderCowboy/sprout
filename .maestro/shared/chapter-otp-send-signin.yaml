appId: app.stackmint.sprout.dev
---
# Intro → Sign in → email → Continue → verify OTP field.
# Requires EMAIL. Leaves app on verify_otp_code_field.
- extendedWaitUntil:
    visible:
      id: "intro_next"
    timeout: 45000

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_sign_in"

- extendedWaitUntil:
    visible:
      id: "sign_in_email_field"
    timeout: 10000

- tapOn:
    id: "sign_in_email_field"

- inputText: ${EMAIL}

- hideKeyboard

- tapOn:
    id: "sign_in_continue"

- extendedWaitUntil:
    visible:
      id: "verify_otp_code_field"
    timeout: 30000
