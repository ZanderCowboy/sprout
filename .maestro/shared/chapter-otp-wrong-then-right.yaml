appId: app.stackmint.sprout.dev
---
# Requires: verify_otp_code_field visible (after chapter-otp-send).
# Wrong OTP auto-submits and stays on verify; right OTP auto-submits to shell.
# Do NOT tap Verify — relies on 6-digit auto-submit.

- tapOn:
    id: "verify_otp_code_field"

- inputText: "000000"

- extendedWaitUntil:
    visible:
      id: "verify_otp_code_field"
    timeout: 15000

- assertVisible:
    id: "verify_otp_verify"

- tapOn:
    id: "verify_otp_code_field"

- eraseText

- inputText: ${OTP_CODE}

- extendedWaitUntil:
    visible:
      id: "wizard_skip"
    timeout: 45000
    optional: true

- runFlow:
    when:
      visible:
        id: "wizard_skip"
    file: skip-wizard.yaml

- runFlow: wait-overview.yaml