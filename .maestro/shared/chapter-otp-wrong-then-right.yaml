appId: app.stackmint.sprout.dev
---
# Requires: sign_in_otp_field visible (after chapter-otp-send).
# Wrong OTP auto-submits and stays on verify; right OTP auto-submits to shell.
# Do NOT tap Verify — relies on 6-digit auto-submit.

- tapOn:
    id: "sign_in_otp_field"

- inputText: "000000"

# Allow failed verify round-trip; stay on OTP / Verify UI.
- extendedWaitUntil:
    visible:
      id: "sign_in_otp_field"
    timeout: 15000

- assertVisible:
    id: "sign_in_verify_code"

- tapOn:
    id: "sign_in_otp_field"

- eraseText

- inputText: ${OTP_CODE}

# Auto-submit success: optional first-run wizard, then Overview.
- extendedWaitUntil:
    visible:
      id: "wizard_skip"
    timeout: 45000
    optional: true

- runFlow:
    when:
      visible:
        id: "wizard_skip"
    file: skip-wizard.yaml

- runFlow: wait-overview.yaml