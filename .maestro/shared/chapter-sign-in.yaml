appId: app.stackmint.sprout.dev
---
# Requires: intro screen visible (fresh launch).
# Slides to Create account, opens terms/privacy, focuses fields.
# Does NOT complete OTP or Google (surface smoke only).

- extendedWaitUntil:
    visible:
      id: "intro_next"
    timeout: 45000

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_create_account"

- extendedWaitUntil:
    visible:
      id: "create_account_continue"
    timeout: 5000

- tapOn:
    id: "create_account_terms_link"

- extendedWaitUntil:
    visible:
      text: "Terms of Service"
    timeout: 10000

- back

- tapOn:
    id: "create_account_privacy_link"

- extendedWaitUntil:
    visible:
      text: "Privacy Policy"
    timeout: 10000

- back

- tapOn:
    id: "create_account_display_name_field"

- inputText: "Tour User"

- tapOn:
    id: "create_account_email_field"

- inputText: "tour@example.com"

- hideKeyboard

- assertVisible:
    id: "create_account_continue"
