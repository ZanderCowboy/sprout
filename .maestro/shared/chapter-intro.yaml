appId: app.stackmint.sprout.dev
---
# Requires: intro screen visible (fresh launch).
# Walks intro slides, returns via sign-in back, then OTP sign-in.
# Needs EMAIL + OTP_CODE.

- extendedWaitUntil:
    visible:
      id: "intro_next"
    timeout: 45000

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_sign_in"

- extendedWaitUntil:
    visible:
      id: "sign_in_email_field"
    timeout: 5000

- tapOn:
    id: "sign_in_back"

- extendedWaitUntil:
    visible:
      id: "intro_create_account"
    timeout: 5000

- assertVisible:
    id: "intro_sign_in"

- tapOn:
    id: "intro_sign_in"

- runFlow:
    file: otp-signin-from-sign-in.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- runFlow:
    when:
      visible:
        id: "wizard_skip"
    file: skip-wizard.yaml

- runFlow: wait-overview.yaml
