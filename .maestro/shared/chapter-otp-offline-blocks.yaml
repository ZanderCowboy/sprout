appId: app.stackmint.sprout.dev
---
# Requires: cold start. Walks intro to sign-in email field, enables
# airplane mode, asserts offline banner, then restores connectivity.
# Banner is exposed as accessibilityText on Flutter; match full copy.
# Last intro slide shows Create account + I already have an account
# (no intro_next) — same path as otp-signin-intro.

- extendedWaitUntil:
    visible:
      id: "intro_next"
    timeout: 45000

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_next"

- tapOn:
    id: "intro_sign_in"

- extendedWaitUntil:
    visible:
      id: "sign_in_email_field"
    timeout: 5000

- setAirplaneMode: enabled

- extendedWaitUntil:
    visible:
      text: ".*offline.*"
    timeout: 15000

- assertVisible:
    text: "You're offline — connect to sign in."

- setAirplaneMode: disabled

- extendedWaitUntil:
    notVisible:
      text: ".*offline.*"
    timeout: 15000
