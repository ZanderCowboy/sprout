appId: app.stackmint.sprout.dev
tags:
  - page
env:
  EMAIL: sprout.play.review@gmail.com
---
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/settings.yaml
# Settings hub tiles (open each child and back).
# Run: maestro test .maestro/settings.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-to-overview.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- runFlow: shared/chapter-settings.yaml
