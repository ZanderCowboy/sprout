appId: app.stackmint.sprout.dev
---
# Test: Creating a goal with 0 accounts shows "create account first" message
# Requires: development flavor. Tap Debug sign in on intro or Sign in.
# Run: maestro test .maestro/goal-no-accounts.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      text: "Debug sign in"
    timeout: 45000

- tapOn: "Debug sign in"

- extendedWaitUntil:
    visible:
      text: "Portfolio total"
    timeout: 15000

# Verify empty state guidance is shown
- assertVisible: "Welcome to Sprout"

# Try to create a goal before creating any accounts
- tapOn:
    text: "New goal"
    index: 0  # First "New goal" button in guidance

- extendedWaitUntil:
    visible:
      text: "New goal"
    timeout: 5000

# Should see the "create account first" message
- assertVisible: "Create an account first to hold money for this goal."

# Verify the CTA is present
- assertVisible: "New account"

# Tap the "New account" button
- tapOn: "New account"

# Should now be in account creation
- extendedWaitUntil:
    visible:
      text: "New account"
    timeout: 5000

# Success: User gets clear guidance instead of being trapped
