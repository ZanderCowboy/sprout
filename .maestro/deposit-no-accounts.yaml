appId: app.stackmint.sprout.dev
tags:
  - edge
env:
  EMAIL: sprout.play.review@gmail.com
---
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/deposit-no-accounts.yaml
# Deposit with 0 accounts shows "create an account first" CTA
# Run: maestro test .maestro/deposit-no-accounts.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-to-overview.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- assertVisible:
    id: "overview_empty_new_account"

- runFlow: shared/open-center-sheet.yaml

- tapOn:
    id: "shell_action_deposit"

- extendedWaitUntil:
    visible:
      text: "Create an account first"
    timeout: 5000

- assertVisible: "New account"

- tapOn:
    id: "deposit_no_accounts_new_account"

- extendedWaitUntil:
    visible:
      text: "New account"
    timeout: 5000
