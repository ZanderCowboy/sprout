appId: app.stackmint.sprout.dev
tags:
  - play-store
env:
  EMAIL: sprout.play.review@gmail.com
---
# Play Store screenshot capture flow
# OTP sign-in, completes the first-run wizard, then captures Overview/Goals/Accounts.
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/play-store-screenshots.yaml
# Output: ~/.maestro/tests/<timestamp>/play-*.png

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-intro.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- runFlow:
    file: shared/complete-wizard.yaml
    env:
      GOAL_NAME: "Cape Town trip"
      TARGET: "12000"
      ACCOUNT_NAME: "EasyEquities TFSA"
      AMOUNT: "2500"

- extendedWaitUntil:
    visible:
      id: "overview_progress_header"
    timeout: 10000

- tapOn:
    text: "Done"
    optional: true

- waitForAnimationToEnd

- takeScreenshot: play-overview

- tapOn:
    id: "shell_tab_goals"

- extendedWaitUntil:
    visible:
      text: "Goals"
    timeout: 5000

- waitForAnimationToEnd

- takeScreenshot: play-goals

- tapOn:
    id: "shell_tab_accounts"

- extendedWaitUntil:
    visible:
      text: "Accounts"
    timeout: 5000

- waitForAnimationToEnd

- takeScreenshot: play-accounts

- tapOn:
    id: "shell_tab_overview"
