appId: app.stackmint.sprout.dev
tags:
  - play-store
---
# Play Store screenshot capture flow
# Completes the first-run wizard (goal, account, deposit), then captures
# Overview, Goals, and Accounts.
# Output: ~/.maestro/tests/<timestamp>/play-*.png

- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      id: "intro_debug_sign_in"
    timeout: 45000

- tapOn:
    id: "intro_debug_sign_in"

- runFlow:
    file: shared/complete-wizard.yaml
    env:
      GOAL_NAME: "Cape Town trip"
      TARGET: "12000"
      ACCOUNT_NAME: "EasyEquities TFSA"
      AMOUNT: "2500"

- extendedWaitUntil:
    visible:
      id: "overview_progress_header"
    timeout: 10000

# Welcome toast covers the hero; dismiss it before capturing.
- tapOn:
    text: "Done"
    optional: true

- waitForAnimationToEnd

- takeScreenshot: play-overview

- tapOn:
    id: "shell_tab_goals"

- extendedWaitUntil:
    visible:
      text: "Goals"
    timeout: 5000

- waitForAnimationToEnd

- takeScreenshot: play-goals

- tapOn:
    id: "shell_tab_accounts"

- extendedWaitUntil:
    visible:
      text: "Accounts"
    timeout: 5000

- waitForAnimationToEnd

- takeScreenshot: play-accounts

- tapOn:
    id: "shell_tab_overview"
