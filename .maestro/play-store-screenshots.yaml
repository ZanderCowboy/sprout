appId: app.stackmint.sprout
tags:
  - play-store
env:
  EMAIL: sprout.play.review@gmail.com
  # Leave empty for human OTP handoff (default). Optional fast-path: OTP_CODE=xxxxxx
  OTP_CODE: ""
---
# Play Store screenshot capture on production (banner-free release).
# Uses real email OTP with human pause — no debug sign-in.
# Alternate auth: shared/google-signin-handoff.yaml (documented device handoffs).
#
# Prerequisites:
#   cd sprout_app
#   flutter build apk --release --flavor production -t lib/main_production.dart
#   flutter install --release --flavor production
# Ensure debug_lens bubble is off (PROD RC default; Environment page owns the toggle).
#
# Run (CT-MAC-75 Pixel_10_Pro / emulator-5554):
#   maestro test --device emulator-5554 .maestro/play-store-screenshots.yaml
#   OTP_CODE=xxxxxx maestro test --device emulator-5554 .maestro/play-store-screenshots.yaml
#
# Output: ~/.maestro/tests/<timestamp>/play-*.png
# Copy via ./tool/capture_play_screenshots.sh (or manually into store/play/screenshots/).

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/email-otp-human-pause.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- runFlow:
    file: shared/complete-wizard-play.yaml
    env:
      GOAL_NAME: "Cape Town trip"
      TARGET: "12000"
      ACCOUNT_NAME: "EasyEquities TFSA"
      AMOUNT: "2500"

- extendedWaitUntil:
    visible:
      id: "overview_progress_header"
    timeout: 10000

- tapOn:
    text: "Done"
    optional: true

- waitForAnimationToEnd

- takeScreenshot: play-overview

- tapOn:
    id: "shell_tab_goals"

- extendedWaitUntil:
    visible:
      text: "Goals"
    timeout: 5000

- waitForAnimationToEnd

- takeScreenshot: play-goals

- tapOn:
    id: "shell_tab_accounts"

- extendedWaitUntil:
    visible:
      text: "Accounts"
    timeout: 5000

- waitForAnimationToEnd

- takeScreenshot: play-accounts

- tapOn:
    id: "shell_tab_overview"
