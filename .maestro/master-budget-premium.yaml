appId: app.stackmint.sprout.dev
tags:
  - page
  - premium
  - budget
  - subscribed
env:
  EMAIL: sprout.play.review@gmail.com
---
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/master-budget-premium.yaml
# Premium active: OTP sign-in → Purchases.logIn(supabase uid).
# QA: grant Premium promo on the review account Supabase App User ID in RevenueCat,
# or complete a Test Store purchase for that identity first.

# Run: maestro test .maestro/master-budget-premium.yaml

- setAirplaneMode: disabled

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-to-overview.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- tapOn:
    id: "shell_tab_settings"

- extendedWaitUntil:
    visible:
      id: "settings_premium"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: ".*Premium active.*"
    timeout: 30000

- assertVisible:
    text: ".*Premium active.*"

- extendedWaitUntil:
    visible:
      id: "settings_budget"
    timeout: 10000

- tapOn:
    id: "settings_budget"

- extendedWaitUntil:
    visible:
      text: "Master Budget"
    timeout: 15000

- assertVisible:
    text: "Master Budget"

- assertVisible:
    id: "budget_sort"
