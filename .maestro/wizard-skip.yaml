appId: app.stackmint.sprout.dev
tags:
  - wizard
env:
  EMAIL: sprout.play.review@gmail.com
---
# Wizard skip: OTP → Skip → empty Overview → verify first_run_completed persisted
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/wizard-skip.yaml
# Run: maestro test .maestro/wizard-skip.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-intro.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- extendedWaitUntil:
    visible:
      id: "wizard_skip"
    timeout: 10000

- assertVisible:
    text: "Step 1 of 3"

- runFlow: shared/skip-wizard.yaml

- extendedWaitUntil:
    visible:
      id: "shell_tab_overview"
    timeout: 10000

- assertVisible:
    text: "Welcome to Sprout"

- assertVisible:
    text: "1. Create a goal"

- assertVisible:
    text: "2. Add an account"

- assertVisible:
    text: "3. Make a deposit"

- assertVisible:
    id: "overview_empty_new_goal"

- assertVisible:
    id: "overview_empty_new_account"

- assertVisible:
    id: "overview_empty_deposit"

# Session persists — relaunch without clearState should land on Overview
- stopApp

- launchApp

- extendedWaitUntil:
    visible:
      id: "shell_tab_overview"
    timeout: 45000

- assertVisible:
    text: "Welcome to Sprout"
