appId: app.stackmint.sprout.dev
tags:
  - page
  - premium
  - killswitch
env:
  EMAIL: sprout.play.review@gmail.com
---
# Assert Settings Premium card is hidden when revenuecat_enabled is off.
# Sign in with OTP online first (real auth), then airplane-mode cold start so
# Firebase Remote Config fetch fails and in-app defaults apply
# (RemoteFeatureFlag.revenueCatEnabled defaultValue: false).
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/settings-premium-killswitch-off.yaml
# Run: maestro test .maestro/settings-premium-killswitch-off.yaml

- setAirplaneMode: disabled

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-to-overview.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- setAirplaneMode: enabled

- stopApp

- launchApp

- extendedWaitUntil:
    visible:
      id: "shell_tab_settings"
    timeout: 45000

- tapOn:
    id: "shell_tab_settings"

- extendedWaitUntil:
    visible:
      id: "settings_transactions"
    timeout: 10000

- assertVisible:
    id: "settings_transactions"

- assertVisible:
    id: "settings_account"

- assertNotVisible:
    id: "settings_premium"

- setAirplaneMode: disabled
