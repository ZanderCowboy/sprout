appId: app.stackmint.sprout.dev
tags:
  - smoke
---
# Core savings loop: account → goal → deposit → verify progress
# Run: maestro test .maestro/core-loop.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: shared/debug-signin-intro.yaml

- assertVisible:
    id: "overview_empty_new_account"

- tapOn:
    id: "overview_empty_new_account"

- extendedWaitUntil:
    visible:
      text: "New account"
    timeout: 5000

- runFlow:
    file: shared/fill-account-form.yaml
    env:
      ACCOUNT_NAME: "Test Savings"
      COLOR_INDEX: "2"

- runFlow: shared/wait-overview.yaml

- tapOn:
    id: "overview_new_goal"

- extendedWaitUntil:
    visible:
      text: "New goal"
    timeout: 5000

- runFlow:
    file: shared/fill-goal-form.yaml
    env:
      GOAL_NAME: "Vacation Fund"
      TARGET: "5000"

- runFlow: shared/wait-overview.yaml

- tapOn:
    id: "overview_deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 5000

- runFlow:
    file: shared/deposit-to-goal.yaml
    env:
      ACCOUNT_NAME: "Test Savings"
      GOAL_NAME: "Vacation Fund"
      AMOUNT: "1000"

- runFlow: shared/wait-overview.yaml

- tapOn:
    id: "shell_tab_goals"

- assertVisible: "Goals"

- assertVisible:
    id: "goal_card"

- tapOn:
    id: "goal_card"

- extendedWaitUntil:
    visible:
      text: "Vacation Fund"
    timeout: 5000

# Verify progress shows on goal detail
- assertVisible:
    id: "goal_detail_deposit"
