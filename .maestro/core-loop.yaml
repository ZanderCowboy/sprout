appId: app.stackmint.sprout.dev
---
# Core savings loop: account → goal → deposit → verify progress
# Run: maestro test .maestro/core-loop.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: shared/debug-signin-intro.yaml

- assertVisible: "1. Add an account"

- tapOn:
    id: "overview_empty_new_account"

- extendedWaitUntil:
    visible:
      text: "New account"
    timeout: 5000

- runFlow:
    file: shared/fill-account-form.yaml
    env:
      ACCOUNT_NAME: "Test Savings"
      COLOR_INDEX: "2"

- runFlow: shared/wait-overview.yaml

- tapOn:
    id: "overview_new_goal"

- extendedWaitUntil:
    visible:
      text: "New goal"
    timeout: 5000

- runFlow:
    file: shared/fill-goal-form.yaml
    env:
      GOAL_NAME: "Vacation Fund"
      TARGET: "5000"

- runFlow: shared/wait-overview.yaml

- tapOn:
    id: "overview_deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 5000

- runFlow:
    file: shared/deposit-to-goal.yaml
    env:
      ACCOUNT_NAME: "Test Savings"
      GOAL_NAME: "Vacation Fund"
      AMOUNT: "1000"

- tapOn:
    id: "shell_tab_goals"

- assertVisible: "Goals"

- assertVisible: "Vacation Fund"

- tapOn:
    id: "goal_card"
    text: "Vacation Fund"

- extendedWaitUntil:
    visible:
      text: "Vacation Fund"
    timeout: 5000

- assertVisible: "Remaining"
