appId: app.stackmint.sprout.dev
---
# Core savings loop test: account → goal → deposit → verify progress
# Requires: development flavor. Tap Debug sign in on intro or Sign in.
# Run: maestro test .maestro/core-loop.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      text: "Debug sign in"
    timeout: 45000

- tapOn: "Debug sign in"

- extendedWaitUntil:
    visible:
      text: "Portfolio total"
    timeout: 15000

# Verify empty state guidance is shown
- assertVisible: "Welcome to Sprout"

# Step 1: Create an account
- tapOn:
    text: "New account"
    index: 0  # First "New account" button in guidance steps

- extendedWaitUntil:
    visible:
      text: "New account"
    timeout: 5000

- tapOn:
    id: "account_name_field"

- inputText: "Test Savings"

- tapOn: "Save"

- extendedWaitUntil:
    visible:
      text: "Portfolio total"
    timeout: 5000

# Step 2: Create a goal
- tapOn:
    text: "New goal"
    index: 0  # First "New goal" button in guidance

- extendedWaitUntil:
    visible:
      text: "New goal"
    timeout: 5000

- tapOn:
    id: "goal_name_field"

- inputText: "Vacation Fund"

- tapOn:
    id: "goal_target_field"

- inputText: "5000"

- tapOn: "Save"

- extendedWaitUntil:
    visible:
      text: "Portfolio total"
    timeout: 5000

# Step 3: Make a deposit
- tapOn: "Deposit"

- extendedWaitUntil:
    visible:
      text: "Deposit"
    timeout: 5000

# Select account (should be pre-selected)
- tapOn: "Account"

- tapOn: "Test Savings"

# Select goal
- tapOn: "Goal"

- tapOn: "Vacation Fund"

# Enter amount
- tapOn:
    id: "deposit_amount_field"

- inputText: "1000"

- tapOn: "Save"

# Verify deposit succeeded and Overview updated
- extendedWaitUntil:
    visible:
      text: "Portfolio total"
    timeout: 5000

# Navigate to Goals tab to verify progress
- tapOn: "Goals"

- assertVisible: "Goals"

- assertVisible: "Vacation Fund"

# Tap on the goal to see details
- tapOn: "Vacation Fund"

- extendedWaitUntil:
    visible:
      text: "Vacation Fund"
    timeout: 5000

# Verify progress shows
- assertVisible: "Remaining"

# Success: The core loop (account → goal → deposit → progress) completed
