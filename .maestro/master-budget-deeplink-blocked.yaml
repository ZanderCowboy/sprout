appId: app.stackmint.sprout.dev
tags:
  - page
  - premium
  - budget
  - deeplink
env:
  EMAIL: sprout.play.review+free@gmail.com
---
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/master-budget-deeplink-blocked.yaml
# Deep-link / route-guard block for /settings/budget when not Premium.
#
# AUTOMATION STATUS (2026-09-26 QA on emulator-5554; updated 2026-09-27 for OTP):
# - AndroidManifest has LAUNCHER only — no VIEW / App Links / custom-scheme
#   intent-filter. Docs (SUPABASE_AUTH_TODOS) mark OS deep links as deferred.
# - `adb resolve-activity -d https://sprout.app/settings/budget` → Chrome,
#   not Sprout. `sprout://settings/budget` → No activity found.
# - The default free alias is a non-Premium OTP identity; do not grant
#   Premium on it when running this stub.
#
# Keep this flow as a stub for when (1) a free-user identity is used AND (2) a
# real deep-link / in-app navigation harness exists. Do not treat as E2E green.
#
# Intended steps once unblocked:
# - free user on Settings → open /settings/budget → assert settings_budget
#   visible and budget_sort / Master Budget NOT visible (BudgetPlannerGate).


- setAirplaneMode: disabled

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-to-overview.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- tapOn:
    id: "shell_tab_settings"

- extendedWaitUntil:
    visible:
      id: "settings_budget"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: ".*Upgrade.*"
    timeout: 20000

# Placeholder — unresolved until App Links / scheme registered for this appId.
- openLink: "https://sprout.app/settings/budget"

- extendedWaitUntil:
    visible:
      id: "settings_budget"
    timeout: 15000

- assertVisible:
    id: "settings_budget"

- assertNotVisible:
    id: "budget_sort"
