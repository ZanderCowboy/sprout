appId: app.stackmint.sprout.dev
tags:
  - page
  - premium
  - budget
  - deeplink
---
# Deep-link / route-guard block for /settings/budget when not Premium.
#
# AUTOMATION STATUS (2026-09-26 QA on emulator-5554):
# - AndroidManifest has LAUNCHER only — no VIEW / App Links / custom-scheme
#   intent-filter. Docs (SUPABASE_AUTH_TODOS) mark OS deep links as deferred.
# - `adb resolve-activity -d https://sprout.app/settings/budget` → Chrome,
#   not Sprout. `sprout://settings/budget` → No activity found.
# - While maestro-test-user promo premium is active, clearState+debugSignIn
#   logs in as Premium, so a free-user redirect assert cannot run anyway.
#
# Keep this flow as a stub for when (1) promo is revoked AND (2) a real
# deep-link / in-app navigation harness exists. Do not treat as E2E green.
#
# Intended steps once unblocked:
# - free user on Settings → open /settings/budget → assert settings_budget
#   visible and budget_sort / Master Budget NOT visible (BudgetPlannerGate).

- setAirplaneMode: disabled

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: shared/debug-signin-intro.yaml

- tapOn:
    id: "shell_tab_settings"

- extendedWaitUntil:
    visible:
      id: "settings_budget"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: ".*Upgrade.*"
    timeout: 20000

# Placeholder — unresolved until App Links / scheme registered for this appId.
- openLink: "https://sprout.app/settings/budget"

- extendedWaitUntil:
    visible:
      id: "settings_budget"
    timeout: 15000

- assertVisible:
    id: "settings_budget"

- assertNotVisible:
    id: "budget_sort"
