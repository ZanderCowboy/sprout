appId: app.stackmint.sprout.dev
tags:
  - edge
  - auth
env:
  EMAIL: sprout.play.review@gmail.com
---
# #56: sign-out clears session but keeps local Hive data.
# Requires two OTP codes (initial + re-auth after sign-out):
#   OTP_CODE=xxxxxx OTP_CODE_REAUTH=yyyyyy maestro test .maestro/sign-out-keeps-data.yaml
# Run: maestro test .maestro/sign-out-keeps-data.yaml
# Overview may not show goal names — assert on Goals tab.

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-to-overview.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- runFlow:
    file: shared/seed-core.yaml
    env:
      SEED_GOAL: "true"

- tapOn:
    id: "shell_tab_goals"

- assertVisible:
    text: ".*Everyday Fund.*"

- runFlow: shared/chapter-sign-out.yaml

- runFlow:
    file: shared/otp-signin-from-sign-in.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE_REAUTH}

- extendedWaitUntil:
    visible:
      id: "shell_tab_overview"
    timeout: 20000

- tapOn:
    id: "shell_tab_goals"

- assertVisible:
    text: ".*Everyday Fund.*"
