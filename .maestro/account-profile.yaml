appId: app.stackmint.sprout.dev
tags:
  - page
env:
  EMAIL: sprout.play.review@gmail.com
---
# Requires OTP_CODE at runtime:
#   OTP_CODE=xxxxxx maestro test .maestro/account-profile.yaml
# Account profile: edit name, legal links, delete cancel (no sign-out).
# Run: maestro test .maestro/account-profile.yaml

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow:
    file: shared/otp-signin-to-overview.yaml
    env:
      EMAIL: ${EMAIL}
      OTP_CODE: ${OTP_CODE}

- runFlow: shared/chapter-account-profile.yaml
