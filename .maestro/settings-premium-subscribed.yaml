appId: app.stackmint.sprout.dev
tags:
  - page
  - premium
  - purchases
  - subscribed
---
# Assert Settings Premium card shows subscribed state (Premium active + Manage).
#
# IMPORTANT — Purchases appUserID vs debug sign-in:
# - Cold start with clearState: resolveUserId() mints a random UUID and
#   Purchases.configure uses that UUID BEFORE debugSignIn.
# - debugSignIn sets UserContext/Hive to AuthService.maestroTestUserId
#   (`maestro-test-user`) AND calls Purchases.logIn(maestro-test-user) via
#   PremiumPaywall.logInIfConfigured (wired in service_locator).
# - Therefore a promotional grant (or Test Store purchase) on
#   `maestro-test-user` is visible after clearState + debugSignIn.
# - For free/Upgrade paywall flows, revoke the promo (or wait for expiry)
#   on maestro-test-user first — see settings-premium-upgrade-opens-paywall.yaml.
# - To open Customer Center after Premium active, see
#   settings-premium-customer-center.yaml (#106 Path A).
#
# Run: maestro test .maestro/settings-premium-subscribed.yaml

- setAirplaneMode: disabled

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: shared/debug-signin-intro.yaml

- tapOn:
    id: "shell_tab_settings"

- extendedWaitUntil:
    visible:
      id: "settings_premium"
    timeout: 15000

- assertVisible:
    id: "settings_premium"

# Wait out "Checking subscription...". Merged SproutListTile semantics need regex.
- extendedWaitUntil:
    visible:
      text: ".*Premium active.*"
    timeout: 30000

- assertVisible:
    text: ".*Premium active.*"

- assertVisible:
    text: ".*Manage.*"
