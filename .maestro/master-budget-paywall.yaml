appId: app.stackmint.sprout.dev
tags:
  - page
  - premium
  - budget
  - paywall
---
# Free/unsubscribed: tap Master Budget → paywall → back stays on Settings.
# Needs Upgrade visible (no active entitlement on maestro-test-user after logIn).
# Planner absence after dismiss: budget_sort not visible (Master Budget text
# remains as Settings finance row label).
# Run: maestro test .maestro/master-budget-paywall.yaml

- setAirplaneMode: disabled

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: shared/debug-signin-intro.yaml

- tapOn:
    id: "shell_tab_settings"

- extendedWaitUntil:
    visible:
      id: "settings_premium"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: ".*Upgrade.*"
    timeout: 20000

- assertVisible:
    text: ".*Upgrade.*"

- extendedWaitUntil:
    visible:
      id: "settings_budget"
    timeout: 10000

- tapOn:
    id: "settings_budget"

- extendedWaitUntil:
    visible:
      text: ".*(Monthly|Annual|R79|Subscribe|Continue).*"
    timeout: 25000

- assertVisible:
    text: ".*(Monthly|Annual|R79|Subscribe|Continue).*"

- back

- extendedWaitUntil:
    visible:
      id: "settings_budget"
    timeout: 10000

- assertVisible:
    id: "settings_budget"

# Master Budget text remains on Settings finance row — planner gated by budget_sort.
- assertNotVisible:
    id: "budget_sort"
