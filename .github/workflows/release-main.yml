---
# Merge-to-main release: compute version from PR labels, ship Firebase (dev APK)
# + Play internal (prod AAB) in parallel, then commit the version on success.
#
# Manual dispatch supports retries and one-off rebuilds (see inputs).
# Config: .github/config/version-labels.json
#
name: "Release Main"

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag, or commit SHA to build (defaults to main)."
        required: false
        default: "main"
      bump_type:
        description: "Version bump type (merge uses PR labels instead)."
        required: true
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      play_track:
        description: "Play Console track."
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      skip_firebase:
        description: "Skip Firebase App Distribution upload."
        required: true
        type: boolean
        default: false
      skip_play:
        description: "Skip Play Store upload."
        required: true
        type: boolean
        default: false
      commit_version:
        description: "Commit the computed version after successful uploads (false = rebuild only)."
        required: true
        type: boolean
        default: true
      tester_groups:
        description: "Firebase App Distribution groups (comma-separated)."
        required: false
        default: "default"
      release_notes:
        description: "Release notes for Firebase / Play (defaults to PR title on merge)."
        required: false
        default: ""

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'no-build'))
    runs-on: ubuntu-latest
    outputs:
      version_number: ${{ steps.version_management.outputs.version_number || steps.current_version.outputs.version_number }}
      version_part: ${{ steps.version_management.outputs.version_part || steps.current_version.outputs.version_part }}
      build_number: ${{ steps.version_management.outputs.build_number || steps.current_version.outputs.build_number }}
      bump_type: ${{ steps.resolve_bump_type.outputs.bump_type }}
      commit_version: ${{ steps.resolve_bump_type.outputs.commit_version }}
      play_track: ${{ steps.resolve_bump_type.outputs.play_track }}
      skip_firebase: ${{ steps.resolve_bump_type.outputs.skip_firebase }}
      skip_play: ${{ steps.resolve_bump_type.outputs.skip_play }}
      tester_groups: ${{ steps.resolve_bump_type.outputs.tester_groups }}
      release_notes: ${{ steps.resolve_bump_type.outputs.release_notes }}
      git_ref: ${{ steps.resolve_bump_type.outputs.git_ref }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.git_ref != '' && inputs.git_ref || 'main') || github.sha }}

      - name: Generate GitHub App Token
        id: generate_token
        uses: peter-murray/workflow-application-token-action@v5
        with:
          application_id: ${{ secrets.VERSION_BOT_APP_ID }}
          application_private_key: ${{ secrets.VERSION_BOT_APP_PRIVATE_KEY }}

      - name: Check Version Labels
        id: check_labels
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/check-version-labels
        with:
          labels: ${{ toJson(github.event.pull_request.labels) }}
          target_branch: main
          mode: resolve

      - name: Resolve inputs
        id: resolve_bump_type
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BUMP_TYPE: ${{ inputs.bump_type }}
          LABEL_BUMP_TYPE: ${{ steps.check_labels.outputs.bump_type }}
          MANUAL_COMMIT: ${{ inputs.commit_version }}
          MANUAL_PLAY_TRACK: ${{ inputs.play_track }}
          MANUAL_SKIP_FIREBASE: ${{ inputs.skip_firebase }}
          MANUAL_SKIP_PLAY: ${{ inputs.skip_play }}
          MANUAL_TESTER_GROUPS: ${{ inputs.tester_groups }}
          MANUAL_RELEASE_NOTES: ${{ inputs.release_notes }}
          MANUAL_GIT_REF: ${{ inputs.git_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            bump_type="$MANUAL_BUMP_TYPE"
            commit_version="$MANUAL_COMMIT"
            play_track="$MANUAL_PLAY_TRACK"
            skip_firebase="$MANUAL_SKIP_FIREBASE"
            skip_play="$MANUAL_SKIP_PLAY"
            tester_groups="${MANUAL_TESTER_GROUPS:-default}"
            release_notes="${MANUAL_RELEASE_NOTES:-}"
            git_ref="${MANUAL_GIT_REF:-main}"
          else
            bump_type="$LABEL_BUMP_TYPE"
            # Always commit after a labeled merge release (bump is never none without no-build).
            commit_version="true"
            play_track="internal"
            skip_firebase="false"
            skip_play="false"
            tester_groups="default"
            release_notes="${PR_TITLE:-}"
            git_ref="$MERGE_SHA"
          fi

          echo "bump_type=$bump_type" >> "$GITHUB_OUTPUT"
          echo "commit_version=$commit_version" >> "$GITHUB_OUTPUT"
          echo "play_track=$play_track" >> "$GITHUB_OUTPUT"
          echo "skip_firebase=$skip_firebase" >> "$GITHUB_OUTPUT"
          echo "skip_play=$skip_play" >> "$GITHUB_OUTPUT"
          echo "tester_groups=$tester_groups" >> "$GITHUB_OUTPUT"
          {
            echo "release_notes<<EOF"
            echo "$release_notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "git_ref=$git_ref" >> "$GITHUB_OUTPUT"

          echo "Resolved bump_type=$bump_type commit_version=$commit_version play_track=$play_track"

      - name: Version Management (compute only)
        id: version_management
        if: >-
          steps.resolve_bump_type.outputs.bump_type != 'none' ||
          steps.resolve_bump_type.outputs.commit_version == 'true'
        uses: ./.github/actions/version-management
        with:
          github_token: ${{ steps.generate_token.outputs.token }}
          pubspec_path: sprout_app/pubspec.yaml
          branch_name: main
          bump_type: ${{ steps.resolve_bump_type.outputs.bump_type }}
          commit_changes: "false"

      # Rebuild-only (no bump, no commit): use the version already on the ref.
      - name: Read current version (rebuild only)
        id: current_version
        if: >-
          steps.resolve_bump_type.outputs.bump_type == 'none' &&
          steps.resolve_bump_type.outputs.commit_version != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pubspec_path="sprout_app/pubspec.yaml"
          v="$(grep -E '^[[:space:]]*version:[[:space:]]*' "$pubspec_path" | head -n1 | sed -E 's/^[[:space:]]*version:[[:space:]]*//' | tr -d '\r' | xargs)"
          if ! echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
            echo "::error::Invalid version format in $pubspec_path: $v"
            exit 1
          fi
          version_part="$(echo "$v" | cut -d'+' -f1)"
          build_number="$(echo "$v" | cut -d'+' -f2)"
          echo "version_number=$v" >> "$GITHUB_OUTPUT"
          echo "version_part=$version_part" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Using existing version: $v"

  firebase:
    name: Firebase Dev APK
    needs: [resolve]
    if: needs.resolve.outputs.skip_firebase != 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_CONFIG_BASE64: ${{ secrets.ANDROID_SIGNING_CONFIG_BASE64 }}
      APP_CONFIG_DEV_BASE64: ${{ secrets.APP_CONFIG_DEV_BASE64 }}
      GOOGLE_SERVICES_DEV_BASE64: ${{ secrets.GOOGLE_SERVICES_DEV_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.git_ref }}

      - name: Setup Flutter (and pub get)
        uses: ./.github/actions/flutter-setup
        with:
          working-directory: sprout_app

      - name: Ensure config assets exist (fallback)
        uses: ./.github/actions/ensure-config-assets
        with:
          working-directory: sprout_app

      - name: Configure app config assets from secrets
        working-directory: sprout_app
        env:
          APP_CONFIG_DEV_BASE64: ${{ env.APP_CONFIG_DEV_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p assets/config
          if [[ -n "${APP_CONFIG_DEV_BASE64}" ]]; then
            echo "${APP_CONFIG_DEV_BASE64}" | base64 --decode > assets/config/development.json
            echo "Wrote assets/config/development.json from APP_CONFIG_DEV_BASE64"
          fi

      - name: Write google-services.json (development)
        working-directory: sprout_app
        env:
          GOOGLE_SERVICES_DEV_BASE64: ${{ env.GOOGLE_SERVICES_DEV_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/development
          echo "${GOOGLE_SERVICES_DEV_BASE64}" | base64 --decode > android/app/src/development/google-services.json
          echo "Wrote android/app/src/development/google-services.json"

      - name: Configure Android signing (optional)
        if: ${{ env.ANDROID_SIGNING_CONFIG_BASE64 != '' }}
        uses: ./.github/actions/android-signing-setup
        with:
          working-directory: sprout_app
          signing-config-base64: ${{ env.ANDROID_SIGNING_CONFIG_BASE64 }}

      - name: Build development APK
        working-directory: sprout_app
        env:
          BUILD_NAME: ${{ needs.resolve.outputs.version_part }}
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
        run: |
          set -euo pipefail
          flutter build apk --release --flavor development -t lib/main_development.dart \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --no-tree-shake-icons

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ needs.resolve.outputs.tester_groups }}
          releaseNotes: ${{ needs.resolve.outputs.release_notes }}
          file: sprout_app/build/app/outputs/flutter-apk/app-development-release.apk

  play:
    name: Play Prod AAB
    needs: [resolve]
    if: needs.resolve.outputs.skip_play != 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_CONFIG_BASE64: ${{ secrets.ANDROID_SIGNING_CONFIG_BASE64 }}
      APP_CONFIG_PROD_BASE64: ${{ secrets.APP_CONFIG_PROD_BASE64 }}
      GOOGLE_SERVICES_PROD_BASE64: ${{ secrets.GOOGLE_SERVICES_PROD_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.git_ref }}

      - name: Setup Flutter (and pub get)
        uses: ./.github/actions/flutter-setup
        with:
          working-directory: sprout_app

      - name: Ensure config assets exist (fallback)
        uses: ./.github/actions/ensure-config-assets
        with:
          working-directory: sprout_app

      - name: Configure app config assets from secrets
        working-directory: sprout_app
        env:
          APP_CONFIG_PROD_BASE64: ${{ env.APP_CONFIG_PROD_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p assets/config
          if [[ -n "${APP_CONFIG_PROD_BASE64}" ]]; then
            echo "${APP_CONFIG_PROD_BASE64}" | base64 --decode > assets/config/production.json
            echo "Wrote assets/config/production.json from APP_CONFIG_PROD_BASE64"
          fi

      - name: Write google-services.json (production)
        working-directory: sprout_app
        env:
          GOOGLE_SERVICES_PROD_BASE64: ${{ env.GOOGLE_SERVICES_PROD_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/production
          echo "${GOOGLE_SERVICES_PROD_BASE64}" | base64 --decode > android/app/src/production/google-services.json
          echo "Wrote android/app/src/production/google-services.json"

      - name: Require Android signing secret
        if: ${{ env.ANDROID_SIGNING_CONFIG_BASE64 == '' }}
        run: |
          echo "ANDROID_SIGNING_CONFIG_BASE64 is required for Play Store uploads."
          exit 1

      - name: Configure Android signing
        uses: ./.github/actions/android-signing-setup
        with:
          working-directory: sprout_app
          signing-config-base64: ${{ env.ANDROID_SIGNING_CONFIG_BASE64 }}

      - name: Build production AAB
        working-directory: sprout_app
        env:
          BUILD_NAME: ${{ needs.resolve.outputs.version_part }}
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
        run: |
          set -euo pipefail
          flutter build appbundle --release --flavor production -t lib/main_production.dart \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --no-tree-shake-icons

      - name: Prepare Play release notes
        env:
          RELEASE_NOTES: ${{ needs.resolve.outputs.release_notes }}
        run: |
          set -euo pipefail
          mkdir -p whatsnew
          if [[ -z "${RELEASE_NOTES}" ]]; then
            echo "Production release" > whatsnew/whatsnew-en-US
          else
            printf '%s\n' "${RELEASE_NOTES}" > whatsnew/whatsnew-en-US
          fi

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: app.stackmint.sprout
          releaseFiles: sprout_app/build/app/outputs/bundle/productionRelease/app-production-release.aab
          track: ${{ needs.resolve.outputs.play_track }}
          status: completed
          whatsNewDirectory: whatsnew

  commit-version:
    name: Commit Version
    needs: [resolve, firebase, play]
    # Run when resolve succeeded, commit is requested, and every non-skipped deploy job succeeded.
    # Skipped firebase/play (via skip_* inputs) must not block the commit.
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.commit_version == 'true' &&
      (needs.firebase.result == 'success' || needs.firebase.result == 'skipped') &&
      (needs.play.result == 'success' || needs.play.result == 'skipped') &&
      !(needs.firebase.result == 'skipped' && needs.play.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for local actions)
        uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: generate_token
        uses: peter-murray/workflow-application-token-action@v5
        with:
          application_id: ${{ secrets.VERSION_BOT_APP_ID }}
          application_private_key: ${{ secrets.VERSION_BOT_APP_PRIVATE_KEY }}

      - name: Commit version to main
        uses: ./.github/actions/version-management
        with:
          github_token: ${{ steps.generate_token.outputs.token }}
          pubspec_path: sprout_app/pubspec.yaml
          branch_name: main
          bump_type: none
          target_version: ${{ needs.resolve.outputs.version_number }}
          commit_changes: "true"
