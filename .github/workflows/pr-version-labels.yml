---
# Validates PR version labels before merge into main.
# Fails when labels are missing, conflict across tiers, or violate branch rules.
# Config: .github/config/version-labels.json
#
name: PR Version Labels

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

concurrency:
  group: pr-version-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-version-labels:
    name: Validate Version Labels
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Check Version Labels
        uses: ./.github/actions/check-version-labels
        with:
          labels: ${{ toJson(github.event.pull_request.labels) }}
          target_branch: ${{ github.base_ref }}
          mode: validate
